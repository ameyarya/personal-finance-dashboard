<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Household Money</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0e16">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell"><div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM14.6 9.3c-.4-1-1.4-1.7-2.7-1.7-1.6 0-2.8.9-2.8 2.2 0 3.1 5.8 1.4 5.8 4.6 0 1.3-1.2 2.2-2.9 2.2-1.4 0-2.5-.7-2.9-1.8M12 5.8v1.8M12 16.6v1.8"/></svg></span><div><b id="title">Our household</b><small>Household money</small></div></div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="safe" id="safe"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="search" id="btn-search" data-act="palette" aria-label="Search payments, people, pages (Command K)"><span id="ic-search"></span><span class="ph">Search payments, people, pages</span><kbd id="kbd">⌘K</kbd></button>
      <button class="btn icon add" id="btn-add" data-act="add-tx" aria-label="Add payment" title="Add payment"></button>
      <i class="vsep" aria-hidden="true"></i>
      <button class="btn icon" id="btn-sync" data-act="sync" aria-label="Sync statements" title="Sync statements"></button>
      <button class="btn icon" id="btn-theme" data-act="theme" aria-label="Switch theme"></button>
      <button class="btn icon" id="btn-bell" data-act="bell" aria-label="Noticed" title="Noticed"></button>
      <button class="avatar" id="btn-settings" data-act="settings" aria-label="Settings" title="Settings"></button>
      <div id="pop" role="dialog" hidden></div>
    </div>
    <header class="top">
      <div><div class="date" id="date"></div><h1 id="greet">Household money</h1><p id="lede"></p></div>
      <div class="tools">
        <div class="seg" id="period" role="group" aria-label="View"><button data-act="period" data-id="month" aria-pressed="true">Month</button><button data-act="period" data-id="year" aria-pressed="false">Year</button></div>
        <div class="monthnav"><button class="btn icon" id="prev" data-act="prev" aria-label="Previous month">‹</button><span id="mlabel"></span><button class="btn icon" id="next" data-act="next" aria-label="Next month">›</button></div>
      </div>
    </header>
    <div id="banner" hidden></div>
    <main id="view"></main>
  </div>
</div></div>
<dialog id="dlg"></dialog>
<dialog id="pal" aria-label="Search"></dialog>
<input type="file" id="csv-file" accept=".csv,text/csv,text/plain" hidden>
<div id="synclog" class="synclog" role="dialog" aria-modal="true" aria-labelledby="sl-title" hidden>
  <div class="sl-box">
    <div class="sl-head"><div><h2 id="sl-title">Statement sync</h2><small id="sl-state" aria-live="polite"></small></div><button class="x" data-act="sl-close" aria-label="Close sync window">×</button></div>
    <div class="sl-link"><input id="sl-link" type="url" placeholder="Paste the Google Drive folder link here" aria-label="Google Drive folder link" autocomplete="off"><button class="btn" id="sl-savelink" data-act="sl-savelink">Save link</button></div>
    <div class="bar sl-bar" id="sl-bar"><i id="sl-fill"></i></div>
    <div class="sl-meta"><span id="sl-step"></span><span id="sl-time"></span></div>
    <pre id="sl-log" role="log" tabindex="0" aria-label="Sync log"></pre>
    <div class="sl-acts">
      <label class="check"><input type="checkbox" id="sl-follow" checked>Follow the log</label>
      <button class="btn sm" data-act="sl-copy">Copy log</button><button class="btn sm" data-act="sl-save">Save log</button>
      <span class="spacer"></span>
      <button class="btn sm" id="sl-full" data-act="sl-full">Re-read everything</button>
      <button class="btn sm danger" id="sl-stop" data-act="sync-stop">Stop</button>
      <button class="btn sm primary" id="sl-run" data-act="sl-run">Run again</button>
      <button class="btn sm" data-act="sl-close">Close</button>
    </div>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
