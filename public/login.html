<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Household Money</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0a0e16">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:16px}
  .login{width:min(400px,100%);padding:26px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(155deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--spec),0 40px 80px -30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px}
  .login .logo{width:48px;height:48px;border-radius:15px}
  .login h1{margin:4px 0 0;font-size:28px}.login p{margin:0;color:var(--muted)}
  .login form{display:flex;flex-direction:column;gap:12px}
  .login .btn{justify-content:center;padding:11px 16px;font-size:15px}
  .login small{color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main class="login">
  <span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM14.6 9.3c-.4-1-1.4-1.7-2.7-1.7-1.6 0-2.8.9-2.8 2.2 0 3.1 5.8 1.4 5.8 4.6 0 1.3-1.2 2.2-2.9 2.2-1.4 0-2.5-.7-2.9-1.8M12 5.8v1.8M12 16.6v1.8"/></svg></span>
  <div><h1>Sign in</h1><p>Household money</p></div>
  <form id="f" autocomplete="on">
    <div class="fld"><label for="n">Name</label><input id="n" name="username" autocomplete="username" autocapitalize="words" required autofocus></div>
    <div class="fld"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="e" role="alert"></div>
    <button class="btn primary" id="go">Sign in</button>
  </form>
  <small>Forgot your password? On the computer that runs this page, run <code>python3 server.py --reset-password YourName</code>.</small>
</main>
<script>
(function(){
  var f=document.getElementById('f'),e=document.getElementById('e'),go=document.getElementById('go');
  try{var last=localStorage.getItem('lastUser');if(last)document.getElementById('n').value=last}catch(x){}
  f.addEventListener('submit',function(ev){
    ev.preventDefault();e.textContent='';go.disabled=true;
    fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('n').value,password:document.getElementById('p').value})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(x){if(x.ok){try{localStorage.setItem('lastUser',x.j.user)}catch(y){}location.replace('./')}else{e.textContent=x.j.error||'Could not sign in.';go.disabled=false;document.getElementById('p').select()}})
      .catch(function(){e.textContent='Cannot reach the server.';go.disabled=false});
  });
})();
</script>
</body>
</html>
